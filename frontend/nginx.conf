server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # All routes return index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend. The trailing slash on proxy_pass strips
    # the /api prefix, so the backend sees the paths it actually defines.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The execution view is driven by Server-Sent Events. Buffering would
        # hold events back until the response ended, which for a long run means
        # the UI appears frozen; a long read timeout keeps the stream open.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
